<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrollback</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Cpath d='M9 11h14M9 16h10M9 21h12' stroke='%2338bdf8' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f17;
    --panel: #111827;
    --panel-2: #0f1522;
    --line: #1f2a3d;
    --text: #e5ecf6;
    --muted: #8b9ab3;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --live: #34d399;
    --warn: #fbbf24;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(129,140,248,.12), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(56,189,248,.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: rgba(11,15,23,.8); backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: .2px; }
  .brand svg { width: 22px; height: 22px; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 550;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--live); box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: pulse 1.8s infinite; }
  .pill.warn .dot { background: var(--warn); }
  .pill.bad .dot { background: var(--danger); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }

  button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .05s;
  }
  button:hover { border-color: #33466a; background: #162033; }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; padding: 18px 16px; }
  #stage { width: min(100%, 1400px); }
  #frameWrap {
    position: relative; width: 100%;
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line); background: #000;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  #frameImg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  #textLayer { position: absolute; inset: 0; pointer-events: none; }
  #textLayer .ln {
    position: absolute; pointer-events: auto; white-space: pre;
    color: transparent; transform-origin: 0 0; line-height: 1;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    cursor: text;
  }
  #textLayer .ln::selection, #textLayer .ln *::selection { background: rgba(56,189,248,.45); color: transparent; }
  .dbg #textLayer .ln { outline: 1px solid var(--bc, #fc0); background: rgba(255,255,255,.05); }
  .dbg #textLayer .ln.gutter { outline-style: dashed; }
  #textLayer .ln.gutter { user-select: none; -webkit-user-select: none; pointer-events: none; }
  #textLayer .copyblk {
    position: absolute; pointer-events: auto; font-size: 12px; padding: 3px 10px; border-radius: 8px;
    background: rgba(17,24,39,.92); border: 1px solid #33466a; color: var(--text); opacity: .9; cursor: pointer;
  }
  #textLayer .copyblk:hover { opacity: 1; border-color: var(--accent); }
  #textLayer a { color: transparent; text-decoration: none; cursor: pointer; border-radius: 3px; }
  #textLayer a:hover { background: rgba(129,140,248,.40); outline: 1px solid rgba(129,140,248,.9); }

  #empty {
    display: grid; place-items: center; text-align: center; gap: 8px;
    min-height: 55vh; color: var(--muted);
  }
  #empty h2 { margin: 0; color: var(--text); font-size: 20px; }
  #empty p { margin: 0; max-width: 46ch; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    border-top: 1px solid var(--line); background: rgba(15,21,34,.92);
    padding: 10px 16px; display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center;
  }
  #slider { width: 100%; accent-color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; min-width: 9ch; }
  #liveBtn { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
  #liveBtn.isLive { color: var(--live); border-color: rgba(52,211,153,.4); }
  #liveBtn.behind { background: linear-gradient(135deg, rgba(56,189,248,.22), rgba(129,140,248,.22)); border-color: rgba(129,140,248,.6); }
  #newBadge { background: var(--accent-2); color: #0b0f17; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 7px; }
  .hint { color: var(--muted); font-size: 12px; }
  .toast {
    position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%) translateY(10px);
    background: #172033; border: 1px solid #2a3b5a; padding: 8px 14px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 640px) {
    footer { grid-template-columns: 1fr auto; }
    footer .time { grid-column: 1; }
    #slider { grid-column: 1 / -1; order: -1; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#111827"/><path d="M9 11h14M9 16h10M9 21h12" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/></svg>
    Scrollback
  </div>
  <span class="pill" id="connPill"><span class="dot"></span><span id="connText">Connecting…</span></span>
  <span class="pill" id="presPill" hidden><span class="dot"></span><span id="presText"></span></span>
  <div class="spacer"></div>
  <span class="hint">Select text · click links · ← → to scrub · d = debug</span>
  <button id="copyAll" title="Copy all text on this frame" disabled>Copy all text</button>
</header>

<main id="main">
  <div id="stage">
    <div id="empty">
      <div>
        <div class="spinner" id="spin"></div>
        <h2 id="emptyTitle">Waiting for the presenter…</h2>
        <p id="emptyMsg">Their screen will appear here with selectable text and clickable links.</p>
      </div>
    </div>
    <div id="frameWrap" hidden>
      <img id="frameImg" alt="Presenter's screen">
      <div id="textLayer"></div>
    </div>
  </div>
</main>

<footer>
  <span class="time" id="timeLabel">—</span>
  <input id="slider" type="range" min="0" max="0" value="0" step="1" disabled aria-label="Scrollback timeline">
  <span class="time" id="countLabel">0 frames</span>
  <button id="liveBtn" class="isLive" disabled><span id="liveText">Live</span><span id="newBadge" hidden>0</span></button>
</footer>
<div class="toast" id="toast"></div>
<script src="/viewer.js"></script>
</body>
</html>
